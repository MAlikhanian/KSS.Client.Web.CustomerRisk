# =============================================================================
#  KSS Client Web — customer-risk domain app (multi-zone)
# =============================================================================
#  Modelled on Mpf/deployment/deployment.yaml, which is itself modelled on the
#  Shell's. Differences from the Shell, each deliberate:
#
#   1. NO INGRESS. This zone has no public entrypoint, and that is a security property
#      rather than a deployment preference. The Shell is the only thing the internet talks
#      to; it rewrites /customer-risk/* here over cluster DNS, and at that rewrite it
#      OVERWRITES x-kss-host from the real Host header (Shell/middleware.ts uses .set(), so
#      a client-supplied x-kss-host is destroyed). This zone reads x-kss-host and nothing
#      else, with no fallback, and resolves branding and an optional bound companyId from
#      it (app/layout.tsx, lib/tenants.ts).
#
#      Give this zone its own Ingress and nothing overwrites that header any more: a value
#      the client controls becomes the input to server-side tenant resolution. The
#      NetworkPolicy at the bottom of this file — no Ingress object, ingress only from
#      namespaceSelector name=kss-client-web — is what keeps that from being possible.
#
#      NOT claimed here: that an Ingress alone would expose another tenant's data.
#      lib/tenants.ts states the host-to-company binding is not itself a security boundary,
#      because the x-company-id cookie is user-editable regardless and the Person service is
#      where that check has to live.
#
#      Measured 2026-09-08, and re-measurable in one command: of the 13 zone manifests under
#      KSS.Client\Web (all but the Shell), NONE defines a `kind: Ingress` and each carries a
#      NetworkPolicy. Control for that negative: the Shell's own manifest has 2 Ingress
#      blocks, so the search does fire. Re-check rather than trust the figure — it counts a
#      set that grows, it was "twelve" until a thirteenth zone was added, and nothing here
#      notices when it changes.
#
#   2. PROBES HIT /customer-risk/api/health — a route this app owns, with no database and
#      no session. NOT the Shell's /api/health, which queries Prisma: a probe
#      that touches a backend restarts the pod when the BACKEND is down.
#
#   3. Smaller footprint. One domain, no uploads, no autoscaler.
#
#  ---------------------------------------------------------------------------
#  THIS ZONE HOLDS NO DATA. Every screen reads and writes through the zone's own
#  server routes (app/api/customer-risk/**), which call the CRS service
#  (KSS.Service.SEBA_ERP_CustomerRisk) as the signed-in user, with the active company
#  in X-Company-Id. The service is in ANOTHER namespace, so its URL below is the full
#  cluster name; the bare service name does not resolve from here.
#
#  Two things in this file exist only for that call, and removing either breaks every
#  screen while the probes stay green (they call nothing):
#    - CUSTOMER_RISK_API_BASE_URL and its ConfigMap key;
#    - the DNS and CRS-service egress rules in the NetworkPolicy at the bottom.
#
#  ---------------------------------------------------------------------------
#  THREE THINGS ARE NOT IN THIS FILE, in order of how quietly each one fails:
#
#   A. docker-secret, in THIS namespace       (command file, step 5)
#      Secrets are namespace-scoped; the one in kss-client-web does not carry
#      over. Pods sit in ImagePullBackOff — loud, and describe names the cause.
#
#   B. nextauth-secret, copied from the Shell (command file, step 6)
#      Deliberately absent from the Secret below. Pod refuses to start with
#      CreateContainerConfigError until it exists — loud by design.
#
#   C. ZONES, on the SHELL                    (command file, step 8)
#      ZONES={"customer-risk":"http://kss-client-web-customer-risk-service.kss-client-web-customer-risk.svc.cluster.local"}
#      The silent one. Unset, these pods run, pass every probe, report Ready and
#      take zero traffic, with nothing anywhere reporting a problem.
#
#      ⚠ AND THE SHELL NO LONGER HAS ITS OWN /customer-risk COPY — it was deleted
#      2026-08-27. So unlike Mpf, there is no fallback: if this zone is down or
#      absent from ZONES, /customer-risk/* is 404 or 500, never the old page.
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: kss-client-web-customer-risk
  labels:
    name: kss-client-web-customer-risk
    app: kss-client-web-customer-risk
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kss-client-web-customer-risk
  namespace: kss-client-web-customer-risk
  labels:
    app: kss-client-web-customer-risk
    version: v1.0.0
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: kss-client-web-customer-risk
  template:
    metadata:
      labels:
        app: kss-client-web-customer-risk
        version: v1.0.0
    spec:
      imagePullSecrets:
      - name: docker-secret
      containers:
      - name: kss-client-web-customer-risk
        image: docker-hosted.sebaoffice.ir/kss-client-web-customer-risk:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: HOSTNAME
          value: "0.0.0.0"
        - name: TZ
          value: "UTC"

        # The NextAuth session cookie carries every permission claim (~25 KB
        # JWE-encoded) and overflows Node's default 16 KB header buffer. This
        # zone receives that same cookie, so it needs the same allowance or the
        # request arrives as HTTP 431 / 502.
        - name: NODE_OPTIONS
          value: "--max-http-header-size=131072"

        # ── Auth ────────────────────────────────────────────────────────────
        # ⚠ NEXTAUTH_SECRET MUST BE BYTE-IDENTICAL TO THE SHELL'S.
        # This app does not issue sessions — it decrypts the cookie the Shell
        # issued. A different value is not weaker auth, it is broken auth.
        #
        # The key is deliberately ABSENT from the Secret below and this
        # reference is deliberately NOT `optional`. Together that gives
        # CreateContainerConfigError — the pod refuses to start.
        #
        #   An EMPTY value would be worse: valid base64, so the key exists, the
        #   pod STARTS, and next-auth reads "" (it uses ??, so "" is not
        #   defaulted). assert.js returns MissingSecret in production,
        #   getServerSession throws on the non-200, and every BFF route 500s —
        #   while the probes below need no session, so the pod reports Ready
        #   throughout. A healthy-looking deployment where every call fails.
        #
        # A checked-in key would also be re-blanked by every `kubectl apply`.
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: kss-client-web-customer-risk-secrets
              key: nextauth-secret

        # The public origin. Cookies are scoped by host and path, never by port
        # or by which pod answered — so this stays the Shell's URL.
        - name: NEXTAUTH_URL
          value: "https://erp.seba.ir"

        # Used by next.config.mjs to proxy /api/auth/* back to the Shell. That
        # rewrite is DEV-ONLY (returns [] when NODE_ENV !== development), so in
        # cluster this is inert — set for parity and for local `docker run`.
        - name: SHELL_URL
          value: "https://erp.seba.ir"

        # ── Application ─────────────────────────────────────────────────────
        # NEXT_PUBLIC_BASE_PATH is inlined at BUILD time by the Dockerfile ARG,
        # not read here. Set at runtime too so a mismatch shows in
        # `kubectl describe` rather than only as broken asset URLs.
        - name: NEXT_PUBLIC_BASE_PATH
          value: "/customer-risk"
        - name: NEXT_PUBLIC_APP_NAME
          value: "KSS_Client_Web_customer_risk"

        # ── Tenant branding ─────────────────────────────────────────────────
        # Same ConfigMap pattern as the Shell's. Resolved per request in
        # app/layout.tsx against x-kss-host, which the Shell's middleware stamps
        # from the real Host header. Value is generated from the SHELL manifest
        # by _Kit tooling -- all 13 carry a byte-identical object, so a tenant
        # cannot be branded on Shell pages and unbranded inside a zone.
        # configMapKeyRef is frozen at container start: changing the ConfigMap
        # needs a rollout restart, not just an apply.
        - name: TENANTS
          valueFrom:
            configMapKeyRef:
              name: kss-client-web-customer-risk-config
              key: tenants

        # ── Backend services ────────────────────────────────────────────────
        # Backend services this app calls. Values mirror the Shell's own ConfigMap
        # so the two cannot drift.
        - name: AUTH_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: kss-client-web-customer-risk-config
              key: auth-api-base-url
        # The CRS service, read by services/customer-risk-api.ts. Deliberately not
        # `optional`: without it every route answers 503, so a missing key should
        # stop the pod from starting instead.
        - name: CUSTOMER_RISK_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: kss-client-web-customer-risk-config
              key: customer-risk-api-base-url

        # ── Object storage ──────────────────────────────────────────────────
        # Referenced by shared lib code copied in from _Kit. Marked optional so
        # an absent secret does not block startup — this app has no upload path.
        - name: STORAGE_ENDPOINT
          valueFrom:
            secretKeyRef: { name: kss-client-web-customer-risk-secrets, key: storage-endpoint, optional: true }
        - name: STORAGE_REGION
          valueFrom:
            secretKeyRef: { name: kss-client-web-customer-risk-secrets, key: storage-region, optional: true }
        - name: STORAGE_BUCKET
          valueFrom:
            secretKeyRef: { name: kss-client-web-customer-risk-secrets, key: storage-bucket, optional: true }
        - name: STORAGE_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef: { name: kss-client-web-customer-risk-secrets, key: storage-access-key-id, optional: true }
        - name: STORAGE_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef: { name: kss-client-web-customer-risk-secrets, key: storage-secret-access-key, optional: true }
        - name: STORAGE_CDN_URL
          valueFrom:
            secretKeyRef: { name: kss-client-web-customer-risk-secrets, key: storage-cdn-url, optional: true }

        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        # ── Probes ──────────────────────────────────────────────────────────
        # /customer-risk/api/health — owned by this app, no database, no session. See the
        # route's own comment for why it has no dependencies.
        #
        # timeoutSeconds is explicit on all three: the default is 1s, and a cold
        # Next.js start answering in 1.2s would fail the probe most likely to be
        # slow. (initialDelaySeconds on liveness/readiness is inert while a
        # startupProbe exists; the kubelet runs neither until it passes.)
        livenessProbe:
          httpGet: { path: /customer-risk/api/health, port: 3000, scheme: HTTP }
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet: { path: /customer-risk/api/health, port: 3000, scheme: HTTP }
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet: { path: /customer-risk/api/health, port: 3000, scheme: HTTP }
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 24

        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          readOnlyRootFilesystem: false
          capabilities:
            drop: [ALL]
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: kss-client-web-customer-risk-service
  namespace: kss-client-web-customer-risk
  labels:
    app: kss-client-web-customer-risk
spec:
  selector:
    app: kss-client-web-customer-risk
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  type: ClusterIP
  sessionAffinity: None
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kss-client-web-customer-risk-config
  namespace: kss-client-web-customer-risk
data:
  auth-api-base-url: "https://auth.api.sebaoffice.ir"
  customer-risk-api-base-url: "http://kss-seba-erp-customer-risk-service-service.kss-seba-erp-customer-risk-service.svc.cluster.local"
  tenants: '{"erp.seba.ir":{"name":"SEBA","logo":"/media/app/default-logo.svg","logoDark":"/media/app/default-logo-dark.svg","logoMini":"/media/app/mini-logo.svg","favicon":"/favicon.ico","banner":"/media/images/2600x1600/1.png","bannerDark":"/media/images/2600x1600/1-dark.png","companyId":"019f317a-12ba-764f-b19b-e064e36b4be8","footer":{"brand":{"label":"SEBA","href":"https://seba.ir"},"links":[{"en":"Docs","fa":"مستندات","href":""},{"en":"Purchase","fa":"خرید","href":""},{"en":"FAQ","fa":"سوالات متداول","href":"https://www.seba.ir/%D8%AA%D9%85%D8%A7%D8%B3-%D8%A8%D8%A7-%DA%A9%D8%A7%D9%86%D9%88%D9%86"},{"en":"Support","fa":"پشتیبانی","href":"https://www.seba.ir/%D8%AA%D9%85%D8%A7%D8%B3-%D8%A8%D8%A7-%DA%A9%D8%A7%D9%86%D9%88%D9%86"},{"en":"License","fa":"مجوز","href":""}]}},"members.sebaoffice.ir":{"name":"SEBA","logo":"/media/app/default-logo.svg","logoDark":"/media/app/default-logo-dark.svg","logoMini":"/media/app/mini-logo.svg","favicon":"/favicon.ico","banner":"/media/images/2600x1600/1.png","bannerDark":"/media/images/2600x1600/1-dark.png","companyId":"019f317a-12ba-764f-b19b-e064e36b4be8","footer":{"brand":{"label":"SEBA","href":"https://seba.ir"},"links":[{"en":"Docs","fa":"مستندات","href":""},{"en":"Purchase","fa":"خرید","href":""},{"en":"FAQ","fa":"سوالات متداول","href":"https://www.seba.ir/%D8%AA%D9%85%D8%A7%D8%B3-%D8%A8%D8%A7-%DA%A9%D8%A7%D9%86%D9%88%D9%86"},{"en":"Support","fa":"پشتیبانی","href":"https://www.seba.ir/%D8%AA%D9%85%D8%A7%D8%B3-%D8%A8%D8%A7-%DA%A9%D8%A7%D9%86%D9%88%D9%86"},{"en":"License","fa":"مجوز","href":""}]}},"nerp.sajoffice.ir":{"name":"SAJ","logo":"/media/tenants/saj/logo.png","logoDark":"/media/tenants/saj/logo.png","logoMini":"/media/tenants/saj/logo.png","favicon":"/media/tenants/saj/favicon.png","banner":"/media/tenants/saj/banner.jpg","bannerDark":"/media/tenants/saj/banner.jpg","companyId":"019f0e6c-9fbc-78cf-9202-fa932a9878f7","footer":{"brand":{"label":"SAJ","href":""},"links":[{"en":"Docs","fa":"مستندات","href":""},{"en":"Purchase","fa":"خرید","href":""},{"en":"FAQ","fa":"سوالات متداول","href":""},{"en":"Support","fa":"پشتیبانی","href":""},{"en":"License","fa":"مجوز","href":""}]}},"erp.mpfoffice.ir":{"name":"MPF","logo":"/media/tenants/mpf/logo.svg","logoDark":"/media/tenants/mpf/logo-dark.svg","logoMini":"/media/tenants/mpf/logo-mini.svg","favicon":"/media/tenants/mpf/favicon.svg","banner":"/media/tenants/mpf/banner.svg","bannerDark":"/media/tenants/mpf/banner-dark.svg","companyId":"019f7a3e-1d43-7bcb-a7f3-eb97572e2e02","footer":{"brand":{"label":"MPF","href":""},"links":[{"en":"Docs","fa":"مستندات","href":""},{"en":"Purchase","fa":"خرید","href":""},{"en":"FAQ","fa":"سوالات متداول","href":""},{"en":"Support","fa":"پشتیبانی","href":""},{"en":"License","fa":"مجوز","href":""}]}},"spmoffice.ir":{"name":"SPM","logo":"/media/tenants/spm/logo.svg","logoDark":"/media/tenants/spm/logo-dark.svg","logoMini":"/media/tenants/spm/logo-mini.svg","favicon":"/media/tenants/spm/favicon.svg","banner":"/media/tenants/spm/banner.svg","bannerDark":"/media/tenants/spm/banner-dark.svg","companyId":"01a04744-68ae-7aef-b9d0-b5fb31d7a80c","footer":{"brand":{"label":"SPM","href":""},"links":[{"en":"Docs","fa":"مستندات","href":""},{"en":"Purchase","fa":"خرید","href":""},{"en":"FAQ","fa":"سوالات متداول","href":""},{"en":"Support","fa":"پشتیبانی","href":""},{"en":"License","fa":"مجوز","href":""}]}},"mkoffice.ir":{"name":"MK","footer":{"brand":{"label":"مشیران کاریز","href":"https://moshirankariz.com"},"links":[{"en":"Docs","fa":"مستندات","href":""},{"en":"Purchase","fa":"خرید","href":""},{"en":"FAQ","fa":"سوالات متداول","href":""},{"en":"Support","fa":"پشتیبانی","href":""},{"en":"License","fa":"مجوز","href":""}]},"logo":"/media/tenants/mk/logo.png","logoDark":"/media/tenants/mk/logo.png","logoMini":"/media/tenants/mk/logo.png","favicon":"/media/tenants/mk/favicon.ico","banner":"/media/tenants/mk/banner.jpg","bannerDark":"/media/tenants/mk/banner.jpg","companyId":"01a07fb0-e2e7-7822-b14b-3a70278009ef"}}'
---
# ⚠ `nextauth-secret` IS NOT IN THIS FILE, AND MUST NOT BE ADDED TO IT.
#   1. An empty value would let the pod START and then 500 every route while
#      probes keep reporting Ready. Absent + non-optional gives
#      CreateContainerConfigError instead — the pod never starts.
#   2. `kubectl apply -f` would re-blank a hand-patched value on every apply.
# Create it out-of-band — docker-k8s-command.txt step 6 copies it from the
# Shell's secret, which is the only correct source.
#
# The storage keys ARE checked in empty because their references are
# `optional: true` — absent or empty, the pod starts either way.
#
# To set a single value:
#   kubectl patch secret kss-client-web-customer-risk-secrets -n kss-client-web-customer-risk \
#     -p "{\"data\":{\"KEY\":\"$(echo -n 'VALUE' | base64 -w0)\"}}"
apiVersion: v1
kind: Secret
metadata:
  name: kss-client-web-customer-risk-secrets
  namespace: kss-client-web-customer-risk
type: Opaque
data:
  storage-endpoint: ""
  storage-region: ""
  storage-bucket: ""
  storage-access-key-id: ""
  storage-secret-access-key: ""
  storage-cdn-url: ""
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kss-client-web-customer-risk-pdb
  namespace: kss-client-web-customer-risk
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: kss-client-web-customer-risk
---
# Only the Shell may reach this zone. There is no Ingress, so this is belt and
# braces — but it makes "no public entrypoint" a property of the cluster rather
# than of a file nobody re-reads.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kss-client-web-customer-risk-network-policy
  namespace: kss-client-web-customer-risk
spec:
  podSelector:
    matchLabels:
      app: kss-client-web-customer-risk
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: kss-client-web
    ports:
    - protocol: TCP
      port: 3000
  # Egress is a whitelist: anything not matched by one of the three rules below is
  # dropped, INCLUDING name resolution. Each rule is load-bearing.
  egress:
  # 1. Web ports anywhere: AUTH_API_BASE_URL is a public hostname.
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - { protocol: TCP, port: 80 }
    - { protocol: TCP, port: 443 }
    - { protocol: TCP, port: 8000 }
  # 2. DNS, UDP and TCP (TCP carries answers too large for UDP). Without this rule
  #    the pod resolves no name at all, the auth host and the CRS service included,
  #    and every server route fails while the probes, which resolve nothing, pass.
  #    No `to:` on purpose: where the resolver lives (cluster DNS pods, a node-local
  #    cache on a link-local address, or the node itself) depends on the cluster,
  #    and a rule scoped to one of them breaks silently on the others. Narrow it to
  #    the resolver's selector only once that has been read from the cluster.
  - ports:
    - { protocol: UDP, port: 53 }
    - { protocol: TCP, port: 53 }
  # 3. The CRS service, by namespace. The port is the service POD's port (8000), not
  #    the Service's port 80: a policy is evaluated after the Service address is
  #    translated to a pod. Rule 1 lists 8000 too, but whether an ipBlock of
  #    0.0.0.0/0 also matches in-cluster pod addresses depends on the network plugin;
  #    a namespace selector matches them under any plugin. It mirrors the service's
  #    own ingress rule, which admits this namespace on 8000.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kss-seba-erp-customer-risk-service
    ports:
    - { protocol: TCP, port: 8000 }
